[package]
name = "inferena-meganeura"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Meganeura framework benchmark runner for inferena"

[[bin]]
name = "inferena-meganeura"
path = "src/main.rs"

[dependencies]
meganeura = { workspace = true }
# Use the same adapter enumeration and timing API as the pinned Meganeura.
blade-graphics = { version = "0.9", git = "https://github.com/kvark/blade", rev = "eae0c6f7aa3167c79d1135050cf8e17c17fabd0a" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
env_logger = "0.11"
# Host phase markers only; no CUDA SDK or tracing-subscriber dependency.
nvtx = "1.3"
blade-macros = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
