[package]
name = "inferena-meganeura"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Meganeura framework benchmark runner for inferena"

[[bin]]
name = "inferena-meganeura"
path = "src/main.rs"

[dependencies]
meganeura = { workspace = true }
blade-graphics = { version = "0.9", features = ["profile-compilation"] }
blade-macros = "0.3"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "native-tls"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
env_logger = "0.11"
# Host phase markers only; no CUDA SDK or tracing-subscriber dependency.
nvtx = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
